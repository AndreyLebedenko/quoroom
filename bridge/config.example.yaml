# Скопируйте в config.yaml и заполните. config.yaml содержит секреты
# (access_token каждого бота) и не должен уходить в git.
#
# Здесь перечислено ВСЁ, что читает брокер, и ничего сверх того. Если вы
# видели в старых конфигах ключи command, workdir, aliases, mention_only,
# max_replies_per_minute или timeout_seconds — они относились к мосту первого
# поколения (удалено из дерева, тег v1.0.0-rc.1) и брокером молча игнорируются.

homeserver_url: "https://agentschat.local"

# true — обычная проверка сертификата. На Windows этого обычно достаточно:
#   aiohttp читает системное хранилище, куда mkcert -install кладёт свой корень.
# путь к файлу, например "C:/Users/<you>/AppData/Local/mkcert/rootCA.pem"
#   (точный путь скажет `mkcert -CAROOT`) — если true почему-то не сработал.
# false — отключить проверку полностью, только для отладки.
verify_ssl: true

# Внутренний ID комнаты, не alias. Берётся в Element Web:
# комната -> Settings -> Advanced -> "Internal room ID".
room_id: "!REPLACE_ME:agentschat.local"

# Порт, на котором брокер слушает живые сессии. Только 127.0.0.1.
sessionchat_port: 8770

# Предел глубины цепочки агент->агент без участия человека; сбрасывает его
# только сообщение человека. Шести звеньев (значение по умолчанию) хватает на
# переписку, но мало для совместной работы: обсуждение втроём упирается в
# потолок за два-три обмена, а полезное «сервер готов, вот протокол» тратит
# уровень наравне с бесполезным. Когда предел срабатывает, брокер говорит об
# этом в комнату — иначе наблюдающий человек увидит необъяснимую тишину.
max_depth: 20

agents:
  # Ключ словаря — имя агента в командах CLI: --agent claude-code.
  claude-code:
    user_id: "@claude-code:agentschat.local"
    access_token: "PASTE_TOKEN_HERE"
    device_id: "PASTE_DEVICE_ID_HERE"
    # Подпись для людей: брокер по ней НЕ адресует. Обращение работает
    # только через @claude-code, пилюлю Element или @room — иначе агент
    # по имени OpenCode считал бы обращением любое упоминание CLI.
    display_name: "Claude Code"
    # delivery не указан — значит listener: сессия сама держит фоновый
    # процесс, выход которого её будит.

  opencode:
    user_id: "@opencode:agentschat.local"
    access_token: "PASTE_TOKEN_HERE"
    device_id: "PASTE_DEVICE_ID_HERE"
    display_name: "OpenCode"
    # Слушателем для OpenCode работает плагин agentschat.js, который
    # agentschat install кладёт в каталог плагинов OpenCode пользователя:
    # он живёт внутри процесса OpenCode и вкладывает входящее прямо в сессию.
    delivery: "plugin"

    # Четвёртый режим, push: брокер сам стучится в HTTP-сервер живой сессии.
    # Работает, но потребителей не имеет — OpenCode перешёл на плагин, потому
    # что push требовал запускать его консолью, с открытым портом.
    #   server_url: "http://127.0.0.1:8799"

  # Имя агента — это участник комнаты, а не название CLI. Одна и та же
  # программа может держать несколько сессий, и каждая входит под своим
  # именем: тогда в комнате это разные собеседники со своими пилюлями,
  # аватарами и адресацией. Заведите аккаунт на каждое имя и добавьте запись:
  #
  #   terra:
  #     user_id: "@terra:agentschat.local"
  #     access_token: "PASTE_TOKEN_HERE"
  #     device_id: "PASTE_DEVICE_ID_HERE"
  #     display_name: "Terra"
  #     delivery: "plugin"
  #
  # Сессия входит под этим именем командой /chatlogin terra.
  #
  # Имя выбирайте такое, какое не встретится в обычном разговоре: адресация
  # идёт по границам слова, и агент по имени GLM будет считать обращением
  # к себе любое упоминание модели GLM.
