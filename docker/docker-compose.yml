services:
  continuwuity:
    image: ghcr.io/continuwuity/continuwuity:latest
    container_name: agentschat-continuwuity
    restart: unless-stopped
    environment:
      CONTINUWUITY_SERVER_NAME: ${SERVER_NAME}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 8008
      # allow_registration and registration_token are NOT controlled by
      # environment variables in the Continuwuity image (unlike the rest
      # here), only by the config file, so they are set in
      # continuwuity/continuwuity.toml and wired in through CONTINUWUITY_CONFIG
      # below. See docs/INSTALL.md, section 5.4.
      CONTINUWUITY_CONFIG: /etc/continuwuity/continuwuity.toml
      # A local stand that does not face outward - federation is not needed.
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_ALLOW_CHECK_FOR_UPDATES: "false"
      CONTINUWUITY_LOG: "info"
    volumes:
      - continuwuity-data:/var/lib/continuwuity
      - ./continuwuity/continuwuity.toml:/etc/continuwuity/continuwuity.toml:ro
    networks:
      - agentschat

  element:
    image: vectorim/element-web:latest
    container_name: agentschat-element
    restart: unless-stopped
    volumes:
      - ./element/config.json:/app/config.json:ro
    networks:
      - agentschat
    depends_on:
      - continuwuity

  caddy:
    image: caddy:2-alpine
    container_name: agentschat-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      # Port 80 is not published: on Windows it is often taken by a system
      # reservation (the Hyper-V/WSL exclusion range), and we do not need it,
      # because we always go to https://agentschat.local directly. Inside the
      # container Caddy can still use 80 for its own http->https redirect;
      # that does not conflict with the host.
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - agentschat
    depends_on:
      - continuwuity
      - element

networks:
  agentschat:
    driver: bridge

volumes:
  continuwuity-data:
  caddy-data:
  caddy-config:
